plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    modLocalRuntime "net.puffish:skillsmod:$rootProject.pufferfish_skills_version:neoforge"
    modLocalRuntime "maven.modrinth:spell-engine:$rootProject.spell_engine_version-neoforge"
    modLocalRuntime "maven.modrinth:spell-power:$rootProject.spell_power_version-neoforge"
    modImplementation "me.shedaniel.cloth:cloth-config-neoforge:$rootProject.cloth_config_version"
    modLocalRuntime "dev.kosmx.player-anim:player-animation-lib-forge:$rootProject.player_anim_version"
    modLocalRuntime "maven.modrinth:tiny-config:$rootProject.tiny_config_version-neoforge"
    modLocalRuntime "org.sinytra.forgified-fabric-api:forgified-fabric-api:$rootProject.forgified_fabric_api_version"
    modLocalRuntime files(rootProject.file("libs/dungeon_difficulty-neoforge-3.6.10+1.21.1.jar"))
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
