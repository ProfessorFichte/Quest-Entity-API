plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

// IMPORTANT: this must NOT point at common/src/main/resources directly. Vanilla's data
// generator treats its output root as fully self-managed and deletes any file under it
// that isn't (re)written by a registered provider in that run - pointing it at a directory
// with hand-authored files (e.g. entity_quest_assignment/*.json) will silently delete them.
// common/src/main/generated is its own resources source root (see common/build.gradle) that
// holds only datagen output, physically separate from hand-authored src/main/resources.
def datagenOutputDir = rootProject.file('common/src/main/generated')

loom {
    runs {
        datagen {
            client()
            name 'Data Generation'
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${datagenOutputDir}"
            vmArg "-Dfabric-api.datagen.modid=qe_api"
            runDir 'build/datagen'
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    modLocalRuntime "net.puffish:skillsmod:$rootProject.pufferfish_skills_version:fabric"
    modLocalRuntime "maven.modrinth:tiny-config:$rootProject.tiny_config_version-fabric"
    modLocalRuntime files(rootProject.file("libs/dungeon_difficulty-fabric-3.6.10+1.21.1.jar"))
    modLocalRuntime "maven.modrinth:levelz:$rootProject.levelz_version-fabric"
    modLocalRuntime "maven.modrinth:libz:$rootProject.libz_version-fabric"

    modImplementation "me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_version"
    modCompileOnly "maven.modrinth:modmenu:$rootProject.modmenu_version"
    modLocalRuntime "maven.modrinth:modmenu:$rootProject.modmenu_version"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
